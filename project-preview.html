<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Preview | Emmanuel Nate</title>
  <link rel="icon" type="image/x-icon" href="fav.ico">
  <style>
    * {box-sizing: border-box}
    [hidden] {display: none !important}
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: #f5f5f5;
      background: #000000;
      font: 14px/1.6 system-ui, sans-serif;
    }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid #262626;
    }
    .preview-title {margin: 0; font-size: 14px; overflow-wrap: anywhere}
    .preview-controls {display: flex; align-items: center; gap: 16px; flex-shrink: 0}
    a {color: #7ee1ff; text-decoration: none}
    a:hover {text-decoration: underline}
    button {
      padding: 8px 12px;
      border: 1px solid #404040;
      border-radius: 6px;
      color: #f5f5f5;
      background: #171717;
      font: inherit;
      cursor: pointer;
    }
    a:focus-visible, button:focus-visible {outline: 2px solid #7ee1ff; outline-offset: 4px}
    .preview-stage {
      display: grid;
      flex: 1;
      place-items: center;
      min-height: 0;
      background: #000000;
    }
    .preview-stage:fullscreen {width: 100%; height: 100%; cursor: zoom-out}
    .preview-image {
      display: block;
      width: 100%;
      height: calc(100vh - 80px);
      height: calc(100dvh - 80px);
      object-fit: contain;
    }
    .preview-stage:fullscreen .preview-image {height: 100vh; height: 100dvh}
    .preview-message {max-width: 460px; margin: 0; padding: 48px 24px; color: #a3a3a3; text-align: center}
    .preview-message h2 {margin: 0 0 8px; color: #f5f5f5; font-size: 22px}
    .preview-message p {margin: 0}
    .preview-status {margin: 0; padding: 0 20px 12px; color: #a3a3a3; font-size: 12px}
    @media (max-width: 600px) {
      .preview-toolbar {align-items: flex-start; flex-direction: column; padding: 12px 16px}
      .preview-image {height: calc(100vh - 128px); height: calc(100dvh - 128px)}
      .preview-controls {justify-content: space-between; width: 100%}
    }
  </style>
</head>
<body>
  <header class="preview-toolbar">
    <h1 class="preview-title" id="previewTitle">Project preview</h1>
    <div class="preview-controls">
      <a href="index.html#projects">Back to projects</a>
      <button id="previewFullscreen" type="button" hidden>Fullscreen</button>
    </div>
  </header>
  <main class="preview-stage" id="previewStage">
    <div class="preview-message" id="previewMessage" role="status">
      <h2 id="previewMessageTitle">Screenshot coming soon</h2>
      <p id="previewMessageText">A screenshot of this project will be available here soon.</p>
    </div>
  </main>
  <p class="preview-status" id="previewStatus" role="status" hidden></p>
  <noscript><p class="preview-message">Enable JavaScript to view the project screenshot.</p></noscript>
  <script src="projects.js"></script>
  <script>
    (() => {
      const projectId = new URLSearchParams(window.location.search).get('project');
      const project = window.portfolioProjects.find(item => item.id === projectId);
      const title = document.getElementById('previewTitle');
      const stage = document.getElementById('previewStage');
      const message = document.getElementById('previewMessage');
      const messageTitle = document.getElementById('previewMessageTitle');
      const messageText = document.getElementById('previewMessageText');
      const fullscreen = document.getElementById('previewFullscreen');
      const status = document.getElementById('previewStatus');

      if (!project) {
        messageTitle.textContent = 'Project not found';
        messageText.textContent = 'Return to the portfolio to choose a project.';
        return;
      }

      title.textContent = project.title;
      document.title = `${project.title} | Project Preview`;
      if (!project.image) return;

      messageTitle.textContent = 'Loading screenshot...';
      messageText.textContent = '';
      const image = document.createElement('img');
      image.className = 'preview-image';
      image.alt = `${project.title} screenshot`;
      image.hidden = true;
      image.addEventListener('load', () => {
        image.hidden = false;
        message.hidden = true;
        fullscreen.hidden = !stage.requestFullscreen || !document.fullscreenEnabled;
      });
      image.addEventListener('error', () => {
        image.hidden = true;
        message.hidden = false;
        fullscreen.hidden = true;
        messageTitle.textContent = 'Screenshot unavailable';
        messageText.textContent = 'Please check back later to view this project.';
      });
      image.src = project.image;
      stage.appendChild(image);

      fullscreen.addEventListener('click', async () => {
        try {
          await stage.requestFullscreen();
          status.hidden = true;
        } catch (error) {
          status.textContent = 'Fullscreen is unavailable. You can still view the screenshot in this tab.';
          status.hidden = false;
        }
      });
      stage.addEventListener('click', () => {
        if (document.fullscreenElement === stage) document.exitFullscreen().catch(() => {});
      });
    })();
  </script>
</body>
</html>
